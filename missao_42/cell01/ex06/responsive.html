<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tabela Responsiva</title>
    <style>
        /* Remove as margens padrão do navegador e garante que a página ocupe 100% da tela */
        html, body {
            margin: 0;
            padding: 0; /* Preenchimento */
            width: 100%;
            height: 100%;
            overflow: hidden; /* Evita barras de rolagem desnecessárias */
        }

        /* Configuração da tabela para preenchimento total e responsividade */
        table {
            width: 100%;
            height: 100%;
            border-collapse: collapse; /* Une as bordas das células */
            text-align: center;
            font-family: sans-serif;
            font-size: 1.5em;
        }

        /* Garante que cada uma das duas células ocupe exatamente metade da tela (50% de largura) */
        td {
            width: 50%;
        }
    </style>
</head>
<body>

    <table>
        <tr>
            <!-- Célula 1 -->
            <td style="background-color: black; color: white;">
                Primeira Célula
            </td>
            
            <!-- Célula 2 -->
            <td style="background-color: Coral; color: white;">
                Segunda Célula
            </td>
        </tr>
    </table>

</body>
</html>

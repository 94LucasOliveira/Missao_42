<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Tabela de Duas Células</title>
    <style>
        /* Estilização básica para dar tamanho e bordas visíveis à tabela */
        table {
            width: 100%;
            height: 300px;
            border-collapse: collapse; /* Une as bordas das células */
            text-align: center;       /* Centraliza o texto dentro delas */
            font-family: sans-serif;
            font-size: 1.5em;
        }
    </style>
</head>
<body>

    <table>
        <tr>
            <!-- Célula 1: Com cor de fundo e texto personalizado -->
            <td style="background-color: black; color: rgb(7, 175, 58);">
                Primeira Célula (Lado Esquerdo)
            </td>
            
            <!-- Célula 2: Com cor de fundo e texto personalizado -->
            <td style="background-color: Coral; color: white;">
                Segunda Célula (Lado Direito)
            </td>
        </tr>
    </table>

</body>
</html>

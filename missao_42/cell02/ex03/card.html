<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cartão de Perfil</title>
  <!-- Conexão com o arquivo de estilo externo -->
  <link rel="stylesheet" href="card.css">
</head>
<body>

  <!-- Container principal que centraliza o cartão na tela -->
  <div class="card-container">
    
    <!-- Tabela invisível usada estritamente para o alinhamento do layout -->
    <table class="tabela-perfil">
      
      <!-- Linha 1: Título do topo -->
      <tr>
        <td>
          <h1 class="titulo-cartao">Spike Spiegel</h1>
        </td>
      </tr>

      <!-- Linha 2: Foto de Perfil -->
      <tr>
        <td>
          <img src="https://www.iamfy.co/cdn/shop/files/m_2Fx1000_2Fe796767c-83a4-4257-b797-df1da531b7c1.jpg?crop=center&height=1000&v=1760711079&width=750&quality=60" alt="Foto de Perfil" class="foto-perfil">
        </td>
      </tr>

      <!-- Linha 3: Login (Nome de Usuário) -->
      <tr>
        <td>
          <h2 class="login-usuario">Spike_Spiegel@CowboyBebop.com</h2>
        </td>
      </tr>

      <!-- Linha 4: Descrição de 2-3 palavras -->
      <tr>
        <td>
          <p class="descricao-curta">Caçador de Recompensas</p>
        </td>
      </tr>

      <!-- Linha 5: Pequenas imagens alinhadas para Redes Sociais (CORRIGIDO) -->
      <tr>
        <td>
          <div class="redes-sociais">
            <!-- Links apontando diretamente para arquivos de logotipos padrão (.svg) -->
            <img src="" alt="GitHub" class="icone-rede">
            <img src="/92d1db1521d374335498624cc95e9554.jpg" alt="LinkedIn" class="icone-rede">
            <img src="Instagram_icon.png" alt="Instagram" class="icone-rede">
          </div>
        </td>
      </tr>

      <!-- Linha 6: Botão clicável de Contato -->
      <tr>
        <td>
          <button class="botao-contato">Contact</button>
        </td>
      </tr>

    </table>

  </div>

</body>
</html>

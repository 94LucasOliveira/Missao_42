<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Menu Sanduíche SNCF</title>
    <!-- Conexão com o arquivo de estilo -->
    <link rel="stylesheet" href="menu.css">
</head>
<body>

    <div class="container-sanduiche">
        <!-- O Menu Principal funciona como a fatia de pão superior -->
        <div class="pao-superior">
            🥪 Menu SNCF (Passe o mouse aqui)
            
            <!-- O Menu Suspenso são os ingredientes que caem/aparecem -->
            <ul class="recheio-dropdown">
                <li class="ingrediente queijo">🧀 Queijo Gruyère Derretido</li>
                <li class="ingrediente presunto">🐷 Presunto de Paris Defumado</li>
                <li class="ingrediente manteiga">🧈 Manteiga Salgada</li>
                <li class="ingrediente pao-inferior">🥖 Fatia de Pão de Baixo</li> 
            </ul>
        </div>
    </div>

</body>
</html>

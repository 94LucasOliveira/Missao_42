<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Efeito Parallax Vertical - Akira</title>
  <link rel="stylesheet" href="parallax.css">
  <!-- Correção nos links de carregamento do Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;600;800&display=swap" rel="stylesheet">
</head>
<body>
        
  <!-- SEÇÃO 1: Primeira imagem com parallax (Kaneda caminhando para a moto) -->
  <section class="parallax-section bg-foto1">

    <!-- uma camada interna para o texto ou cor de sobreposição.-->
    <div class="overlay"></div>
    <div class="content">
        <h1>Tudo está conectado.</h1>
        <h1>O Passado</h1>
    </div>
  </section>

  <!-- SEÇÃO 2: Bloco preto centralizado -->
  <section class="dark-section">
    <div class="content">
        <h1 class="quote">O Presente</h1>
    </div>
  </section>

  <!-- SEÇÃO 3: Segunda imagem com parallax (Tetsuo no trono de destroços) -->
  <section class="parallax-section bg-foto2">
    <div class="overlay"></div>
    <div class="content">
         <h1>e o futuro.</h1>
    </div>
  </section>

</body>
</html>
